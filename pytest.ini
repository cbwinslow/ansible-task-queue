# pytest configuration file

[tool:pytest]
testpaths = tests
python_paths = src
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    database: Database tests

# Coverage configuration
[coverage:run]
source = src/
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[coverage:html]
directory = htmlcov