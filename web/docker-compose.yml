version: '3.8'

services:
  web:
    build: .
    container_name: cloudflare-task-executor
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=task_queue
      - DB_USER=task_queue_user
      - DB_PASSWORD=secure_task_queue_password
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - database
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - app-network

  database:
    image: postgres:13-alpine
    container_name: cloudflare-task-executor-db
    environment:
      - POSTGRES_DB=task_queue
      - POSTGRES_USER=task_queue_user
      - POSTGRES_PASSWORD=secure_task_queue_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: cloudflare-task-executor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./public:/var/www/public
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: